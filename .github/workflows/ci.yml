# FailWatch CI：每次 push / PR 自动跑五道门禁
# format → typecheck → lint → 单测 → build
name: CI

on:
  push:
    # 覆盖所有分支：只写 main + feat/** 会让 docs/**、fix/** 等分支的 push 静默跳过 CI
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions runner 默认 UTC；项目面向中国用户，时间格式化测试依赖 GMT+8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 门禁 1：格式检查（Prettier，最便宜的门禁先跑，失败最快反馈）
      - name: Format check
        run: pnpm format:check

      # 门禁 2：类型检查（sdk / web / collector 全包）
      - name: Typecheck
        run: pnpm typecheck

      # 门禁 3：风格与暗箱拦截（ESLint，强制 no-explicit-any；CODE_REVIEW.md 2.3）
      - name: Lint
        run: pnpm lint

      # 门禁 4：单元测试（vitest，web + collector 全包都跑）
      - name: Unit tests
        run: pnpm -r --if-present test

      # 门禁 5：构建（web 能打包 = 生产可部署）
      - name: Build
        run: pnpm build
