# FailWatch CI：每次 push / PR 自动跑五道门禁
# format → typecheck → lint → 单测 → build
name: CI

on:
  push:
    # 覆盖所有分支：只写 main + feat/** 会让 docs/**、fix/** 等分支的 push 静默跳过 CI
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions runner 默认 UTC；项目面向中国用户，时间格式化测试依赖 GMT+8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup v6 起会读取 package.json 的 packageManager 字段。
      # 注意：不能再在 with 里写 version —— v6 会判定「两处都指定了 pnpm 版本」
      # 并直接报 "Multiple versions of pnpm specified" 中断 job。
      # 因此删掉 version 输入，以 packageManager 为唯一真相源，
      # 保证本地开发与 CI 用的是同一个 pnpm 版本。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 门禁 1：格式检查（Prettier，最便宜的门禁先跑，失败最快反馈）
      - name: Format check
        run: pnpm format:check

      # 门禁 2：类型检查（sdk / web / collector 全包）
      - name: Typecheck
        run: pnpm typecheck

      # 门禁 3：风格与暗箱拦截（ESLint，强制 no-explicit-any；CODE_REVIEW.md 2.3）
      - name: Lint
        run: pnpm lint

      # 门禁 4：单元测试（vitest，web + collector 全包都跑）
      - name: Unit tests
        run: pnpm -r --if-present test

      # 门禁 5：构建（web 能打包 = 生产可部署）
      - name: Build
        run: pnpm build
