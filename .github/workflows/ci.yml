# FailWatch CI：每次 push / PR 自动跑三道门禁
# typecheck → 单测 → build（对应 Interview Forge 的 CI 经验）
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions runner 默认 UTC；项目面向中国用户，时间格式化测试依赖 GMT+8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 门禁 1：类型检查（sdk / web / collector 全包）
      - name: Typecheck
        run: pnpm typecheck

      # 门禁 2：风格与暗箱拦截（ESLint，强制 no-explicit-any；CODE_REVIEW.md 2.3）
      - name: Lint
        run: pnpm lint

      # 门禁 3：单元测试（vitest，web + collector 全包都跑）
      - name: Unit tests
        run: pnpm -r --if-present test

      # 门禁 4：构建（web 能打包 = 生产可部署）
      - name: Build
        run: pnpm build
